# Put this file at:  .github/workflows/scanner.yml
name: Nifty500 Scanner

on:
  schedule:
    - cron: "25 9 * * *"     # EVERY DAY at 09:25 UTC = 2:55 PM IST (GitHub may start a few minutes late).
                             # On weekends / NSE holidays the script finds no new candle and skips automatically.
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save positions.json back to the repo

concurrency: scanner

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRESH_ONLY: "0"
        run: python scanner.py

      - name: Save open positions
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Scan $(date -u +%F)"
          git push
