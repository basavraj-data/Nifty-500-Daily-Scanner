# Put this file at:  .github/workflows/scanner.yml
name: Nifty500 Scanner

on:
  schedule:
    - cron: "25 9 * * *"     # EVERY DAY at 09:25 UTC = 2:55 PM IST (GitHub may start a few minutes late).
                             # On weekends / NSE holidays the script finds no new candle and skips automatically.
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save positions.json back to the repo

concurrency: scanner

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install --upgrade -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRESH_ONLY: "0"
        run: python scanner.py

      - name: Save open positions
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Scan $(date -u +%F)"
          # Pull any changes made to the repo while the scan was running, then push (retry up to 3 times)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."; sleep 5
          done
          echo "::error::Push failed. Check Settings > Actions > General > Workflow permissions = 'Read and write permissions'."
          exit 1
